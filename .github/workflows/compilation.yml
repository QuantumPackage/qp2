name: QP Compilation

on:
  push:
    branches:
    - master
    - dev-stable
  pull_request:
    branches:
    - dev-stable
    - master


jobs:

  configuration:
    runs-on: ubuntu-24.04
    name: Dependencies

    steps:
       - name: install dependencies
         run: |
           sudo apt update
           sudo apt install -y --fix-missing --no-install-recommends  gfortran gcc liblapack-dev libblas-dev wget python3 make m4 pkg-config

  compilation:
    name: Compilation
    runs-on: ubuntu-24.04

    steps:
       - uses: actions/checkout@v3
       - name: Restore configuration
         id: restore
         uses: actions/cache@v3
         continue-on-error: false
         with:
           key: qp2-config
           fail-on-cache-miss: true
           path: |
             include/
             lib/
             lib64/
             libexec/
           restore-keys: qp2-
       - name: install dependencies
         run: |
           sudo apt update
           sudo apt install -y --fix-missing --no-install-recommends  gfortran gcc liblapack-dev libblas-dev wget python3 make m4 pkg-config
       - name: Install Rust toolchain
         run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
       - name: Configuration
         run: |
              # zlib, zeromq and f77zmq normally come from the
              # qp2-config cache, written by the QP Configuration workflow
              # (which runs on master only, so PRs against dev-stable can
              # miss it). If the cache was not restored, install them here.
              if ! ls lib/libzmq.so* >/dev/null 2>&1; then
                ./configure -i zlib || :
                ./configure -i zeromq || :
                ./configure -i f77zmq || :
              fi
              ./configure -i ninja || :
              ./configure -i docopt || :
              ./configure -i resultsFile || :
              ./configure -i bats || :
              ./configure -i trexio-nohdf5 || :
              ./configure -i qmckl || :
              ./configure -i simple_gpu || :
              ./configure -c ./config/gfortran_debug.cfg
       - name: Compilation
         run: |
              bash -c "source quantum_package.rc ; exec ninja"



