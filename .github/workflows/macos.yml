# macOS build check on a GitHub-hosted ARM64 runner (macos-15).
# Build-only: all C/Fortran targets via `ninja all`, plus the Rust tool layer
# through the default `rust_target` (the OCaml tools were replaced by the
# workspace in `rust/`). See ci/macos-ci.sh.
name: QP macOS

on:
  push:
    branches: [master, dev-stable]
  pull_request:
    branches: [master, dev-stable]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  # A cancelled run on a merge commit is indistinguishable from a broken
  # build, so push runs always finish. PR runs still supersede their own
  # previous run: a 35-minute build of a stale commit is worthless.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install toolchain
        run: |
          brew install gfortran gcc hdf5 pkg-config
      - name: Install Rust toolchain
        run: |
          # The Rust tools are pinned by rust/rust-toolchain.toml; installing
          # the matching toolchain up front keeps the build offline-safe.
          # The runner image ships rustup on PATH (not necessarily in
          # $HOME/.cargo); install it only when it is missing.
          if ! command -v rustup >/dev/null; then
            brew install --cask rustup
            rustup-init -y --profile minimal --default-toolchain none --no-modify-path
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.92.0 --profile minimal
      # Dependency install prefix, as cached on x86 by configuration.yml
      # (qp2-config). `configure -i` always rebuilds and never looks at what
      # is installed, so ci/macos-ci.sh skips the whole install stage when
      # lib/.qp2-ci-deps-ok is present -- that marker is written only after a
      # complete install, and it is part of the cached tree, so a run that
      # dies half-way leaves a cache the next run refuses to trust.
      # Keyed on the two files that pin dependency versions, build flags and
      # the package list. Deliberately no restore-keys: a partial match could
      # restore an older install *with* its marker and pass the gate with
      # stale libraries.
      # Bump the vN suffix when the DEPS list in ci/macos-ci.sh changes.
      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            lib/
            include/
            bin/
            share/
            libexec/
            external/Python/
          key: qp2-macos-deps-v1-${{ hashFiles('configure', 'ci/macos-ci.sh') }}
      - name: Configure and build
        run: bash ci/macos-ci.sh
