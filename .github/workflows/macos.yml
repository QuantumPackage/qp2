# macOS build check on a GitHub-hosted ARM64 runner (macos-15).
# Build-only: all C/Fortran targets via `ninja all`. The OCaml tools target
# is intentionally not built — the in-tree opampack (OCaml 4.12, 2023) is
# stale on every platform; see ci/macos-ci.sh.
name: QP macOS

on:
  push:
    branches: [master, dev-stable]
  pull_request:
    branches: [master, dev-stable]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  # A cancelled run on a merge commit is indistinguishable from a broken
  # build, so push runs always finish. PR runs still supersede their own
  # previous run: a 35-minute build of a stale commit is worthless.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install toolchain
        run: |
          brew install gfortran gcc hdf5 pkg-config
      - name: Configure and build
        run: bash ci/macos-ci.sh
