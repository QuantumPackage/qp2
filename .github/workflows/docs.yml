name: QP Documentation

on:
  push:
    branches:
    - master
    - dev-stable
  pull_request:
    branches:
    - dev-stable
    - master


jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-24.04

    steps:
       - uses: actions/checkout@v3
       - name: Set up Python
         uses: actions/setup-python@v5
         with:
           python-version: "3.12"
       - name: Install requirements
         run: |
           python -m pip install --upgrade pip
           pip install -r docs/requirements.txt
       - name: Build documentation
         run: sphinx-build -b html -E docs/source docs/build
       - name: Upload HTML
         uses: actions/upload-artifact@v4
         with:
           name: docs-html
           path: docs/build/html
