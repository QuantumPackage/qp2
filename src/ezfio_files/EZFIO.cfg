[ezfio_convention]
type: integer
doc: Version of the EZFIO conventions (20250211 is the only supported version; input files with an older convention are rejected at runtime, recreate them with qp_create_ezfio)
interface: ezfio, provider, ocaml
default: 20250211

# EZFIO conventions
# 20250211: Current convention: AO normalization factors on the AOs (not the
#           primitives), TREXIO-compatible. The legacy 20210101 convention
#           (GAMESS per-primitive normalization) is no longer supported:
#           input files with ezfio_convention < 20250211 are rejected at
#           runtime, recreate them with qp_create_ezfio.
