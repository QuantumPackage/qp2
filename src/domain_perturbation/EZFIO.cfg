[n_pert]
type: Strictly_positive_int
doc: Maximum order of the domain perturbation theory. Orders 2 to n_pert are computed.
interface: ezfio,provider,ocaml
default: 3

[n_det_domain]
type: Strictly_positive_int
doc: Maximum number of determinants in the domain of an external determinant. If 1, the domains are singletons and the second order is the Epstein-Nesbet |PT2|.
interface: ezfio,provider,ocaml
default: 1

[n_walkers]
type: Positive_int
doc: Average number of walkers per generation. If 0, all the sums are done deterministically (small systems only).
interface: ezfio,provider,ocaml
default: 1000000

[n_replicas]
type: Strictly_positive_int
doc: Number of independent stochastic replicas.
interface: ezfio,provider,ocaml
default: 20

[exact_coupling]
type: logical
doc: If |true|, the coupling vector between the reference state and the external determinants is stored exactly, and the second order is exact. If |false|, this vector is sampled, and its elements needed by the scores are computed on the fly.
interface: ezfio,provider,ocaml
default: True

[domain_seed]
type: Positive_int
doc: Seed of the random number generator
interface: ezfio,provider,ocaml
default: 1

[domain_energy]
type: double precision
doc: Total energy up to order n_pert
interface: ezfio
size: (determinants.n_states)

[domain_energy_error]
type: double precision
doc: Statistical error on the total energy up to order n_pert
interface: ezfio
size: (determinants.n_states)

[domain_chebyshev]
type: logical
doc: If |true|, the series is evaluated at the energy E_0 + E_2 of each state and accelerated with Chebyshev polynomials, and the energy is obtained self-consistently. If |false|, the Rayleigh-Schrodinger series is computed.
interface: ezfio,provider,ocaml
default: False

[domain_cheb_auto]
type: logical
doc: If |true|, the interval of the Chebyshev polynomials is estimated from the terms of the series when at least 4 of them are available. If |false|, or if the estimation fails, domain_cheb_min and domain_cheb_max are used.
interface: ezfio,provider,ocaml
default: True

[domain_cheb_min]
type: double precision
doc: Lower bound of the spectrum of the propagator
interface: ezfio,provider,ocaml
default: -1.

[domain_cheb_max]
type: double precision
doc: Upper bound of the spectrum of the propagator, less than 1
interface: ezfio,provider,ocaml
default: 0.6

[domain_heat_bath]
type: logical
doc: If |true|, the excitations are drawn with the heat-bath algorithm, which does not enumerate the connected determinants. If |false|, all the connected determinants are enumerated (small systems).
interface: ezfio,provider,ocaml
default: True
