[pg_tol]
type: double precision
doc: Geometries are considered symmetric when every atom maps onto an atom of the same element within this distance (bohr).
interface: ezfio, ocaml
default: 1.e-4

[pg_thresh]
type: double precision
doc: Threshold on representation-matrix elements used to decide whether an MO belongs to a symmetry block, and whether a determinant has a definite irrep.
interface: ezfio, ocaml
default: 1.e-6

[pg_data_dir]
type: character*(256)
doc: Directory holding the character tables. None (or empty) means $QP_ROOT/data/Symmetry.
interface: ezfio, ocaml
default: None

[auto_symmetry]
type: logical
doc: If true, detect the molecular point group at the end of SCF/DFT and label the MOs.
interface: ezfio, ocaml
default: True
